apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nhd-demo
  namespace: nhd-demo
  labels:
    # Prometheus only picks up ServiceMonitors with this label.
    release: monitoring
spec:
  selector:
    matchLabels:
      app: nhd-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
