apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhd-demo
  namespace: nhd-demo
  labels:
    app: nhd-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nhd-demo
  template:
    metadata:
      labels:
        app: nhd-demo
    spec:
      securityContext:
        runAsNonRoot: true
        # Numeric UID of distroless's "nonroot" user. Kubernetes can't verify
        # a user *name* is non-root, so runAsNonRoot needs a number.
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: app
          image: nhd-demo:0.1.0
          # Built locally into Rancher Desktop's moby engine, so never pull from a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
